
name: Ubuntu Deployment Preflight

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: "40-character Git commit SHA for the S3 artifact"
        required: true
        type: string
        default: "278bef95c79952e35fa4d2e0c840b9f87287890d"

permissions:
  contents: read
  id-token: write

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Validate release SHA
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid release SHA. Expected 40 lowercase hex characters."
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::288761746621:role/Github_oidc
          aws-region: ap-south-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Run Ubuntu artifact preflight through SSM
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail

          COMMAND_JSON=$(jq -cn \
            --arg cmd "sudo bash /var/opt/Harley_Davidson/.github/scripts/deploy-ubuntu.sh ${RELEASE_SHA}" \
            '{commands: [$cmd]}')

          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --instance-ids "i-01dfcc7734f5c3eb1" \
            --parameters "$COMMAND_JSON" \
            --comment "Harley Davidson Ubuntu artifact preflight" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          STATUS="Pending"

          for attempt in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "i-01dfcc7734f5c3eb1" \
              --query Status \
              --output text 2>/dev/null || true)

            case "$STATUS" in
              Success)
                break
                ;;
              Failed|Cancelled|TimedOut|DeliveryTimedOut|ExecutionTimedOut|Undeliverable|Terminated|InvalidPlatform|AccessDenied)
                echo "Preflight failed with status: $STATUS"
                break
                ;;
            esac

            sleep 5
          done

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-01dfcc7734f5c3eb1" \
            --output json || true

          if [[ "$STATUS" != "Success" ]]; then
            echo "Preflight did not succeed. Final observed status: $STATUS"
            exit 1
          fi


name: Upload Website Artifact to S3

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  upload-and-deploy:
    name: Package, Upload and Deploy through SSM
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate files
        shell: bash
        run: |
          test -f index.html || {
            echo "ERROR: index.html missing"
            exit 1
          }

          test -f .github/scripts/deploy-iis.ps1 || {
            echo "ERROR: deployment script missing"
            exit 1
          }

      - name: Package website
        shell: bash
        run: |
          zip -r website.zip . \
            -x ".git/*" \
               ".github/*" \
               "node_modules/*" \
               "website.zip"

          unzip -Z1 website.zip | grep -Fxq "index.html"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::288761746621:role/Github_oidc
          aws-region: ap-south-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Upload website artifact
        shell: bash
        run: |
          aws s3 cp website.zip \
            "s3://dotnet-windows-s3/artifacts/${GITHUB_SHA}.zip"

      - name: Upload deployment script
        shell: bash
        run: |
          aws s3 cp .github/scripts/deploy-iis.ps1 \
            "s3://dotnet-windows-s3/artifacts/deploy-iis-${GITHUB_SHA}.ps1"

      - name: Verify uploaded artifacts
        shell: bash
        run: |
          aws s3api head-object \
            --bucket dotnet-windows-s3 \
            --key "artifacts/${GITHUB_SHA}.zip"

          aws s3api head-object \
            --bucket dotnet-windows-s3 \
            --key "artifacts/deploy-iis-${GITHUB_SHA}.ps1"

      - name: SSM deployment integration
        shell: bash
        env:
          INSTANCE_ID: i-0fc07c9aecbbf18a2
          RELEASE_ID: ${{ github.sha }}
        run: |
          cat > ssm-commands.json <<JSON
          {
            "commands": [
              "Import-Module AWSPowerShell",
              "Write-Output 'Deployment integration preflight only'",
              "Write-Output ('Release ID: ${RELEASE_ID}')",
              "Write-Output ('Computer: ' + \\$env:COMPUTERNAME)",
              "if (-not (Test-Path 'C:\\\\inetpub\\\\wwwroot\\\\HD\\\\index.html')) { throw 'Live IIS entry file missing' }",
              "if ((Get-PSDrive C).Free -lt 1GB) { throw 'Insufficient free disk space' }",
              "Write-Output 'Preflight passed. No live files changed.'"
            ]
          }
          JSON

          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunPowerShellScript" \
            --instance-ids "$INSTANCE_ID" \
            --parameters file://ssm-commands.json \
            --comment "IIS deployment preflight" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          STATUS=""

          for attempt in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query Status \
              --output text 2>/dev/null || true)

            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut|Cancelling)
                break
                ;;
            esac

            sleep 5
          done

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --output json || true

          if [ "$STATUS" != "Success" ]; then
            echo "Preflight failed: ${STATUS:-Unknown}"
            exit 1
          fi

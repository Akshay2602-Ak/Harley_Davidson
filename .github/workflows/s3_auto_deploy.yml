
name: Upload Website Artifact to S3

on:
  push:
    branches: 
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  upload-and-deploy:
    name: Package, Upload and Deploy through SSM
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate files
        shell: bash
        run: |
          test -f index.html || {
            echo "ERROR: index.html missing"
            exit 1
          }

          test -f .github/scripts/deploy-iis.ps1 || {
            echo "ERROR: deployment script missing"
            exit 1
          }

      - name: Package website
        shell: bash
        run: |
          zip -r website.zip . \
            -x ".git/*" \
               ".github/*" \
               "node_modules/*" \
               "website.zip"

          unzip -Z1 website.zip | grep -Fxq "index.html"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::288761746621:role/Github_oidc
          aws-region: ap-south-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Upload website artifact
        shell: bash
        run: |
          aws s3 cp website.zip \
            "s3://dotnet-windows-s3/artifacts/${GITHUB_SHA}.zip"

      - name: Upload deployment script
        shell: bash
        run: |
          aws s3 cp .github/scripts/deploy-iis.ps1 \
            "s3://dotnet-windows-s3/artifacts/deploy-iis-${GITHUB_SHA}.ps1"

      - name: Verify uploaded artifacts
        shell: bash
        run: |
          aws s3api head-object \
            --bucket dotnet-windows-s3 \
            --key "artifacts/${GITHUB_SHA}.zip"

          aws s3api head-object \
            --bucket dotnet-windows-s3 \
            --key "artifacts/deploy-iis-${GITHUB_SHA}.ps1"

     
     
      - name: Deploy website through SSM
        shell: bash
        env:
          INSTANCE_ID: i-0fc07c9aecbbf18a2
          RELEASE_ID: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os

          release_id = os.environ["RELEASE_ID"]

          commands = [
              "$ErrorActionPreference = 'Stop'",
              "Import-Module AWSPowerShell",
              "$null = New-Item -ItemType Directory -Force -Path 'C:\\Deploy\\staging'",
              f"$scriptPath = 'C:\\Deploy\\staging\\deploy-iis-{release_id}.ps1'",
              f"Read-S3Object -BucketName 'dotnet-windows-s3' -Key 'artifacts/deploy-iis-{release_id}.ps1' -File $scriptPath",
              f"& $scriptPath -ReleaseId '{release_id}'",
              "if ($LASTEXITCODE -and $LASTEXITCODE -ge 8) { throw 'Deployment command failed' }"
          ]

          with open("ssm-commands.json", "w", encoding="utf-8") as f:
              json.dump({"commands": commands}, f)

          print("SSM deployment command JSON generated.")
          PY

          python3 -m json.tool ssm-commands.json

          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunPowerShellScript" \
            --instance-ids "$INSTANCE_ID" \
            --parameters file://ssm-commands.json \
            --comment "Controlled IIS deployment for ${RELEASE_ID}" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          STATUS=""

          for attempt in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query Status \
              --output text 2>/dev/null || true)

            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut|Cancelling)
                break
                ;;
            esac

            sleep 5
          done

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --output json || true

          if [ "$STATUS" != "Success" ]; then
            echo "Deployment did not succeed: ${STATUS:-Unknown}"
            exit 1
          fi

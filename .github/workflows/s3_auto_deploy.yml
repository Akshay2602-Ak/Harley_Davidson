
name: Upload Website Artifact to S3

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  upload-artifact:
    name: Package, Upload and Test SSM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate website files
        shell: bash
        run: |
          if [ ! -f index.html ]; then
            echo "ERROR: index.html was not found."
            exit 1
          fi

          echo "Website entry file found."
          ls -la

      - name: Package website
        shell: bash
        run: |
          zip -r website.zip . \
            -x ".git/*" \
               ".github/*" \
               "node_modules/*" \
               "website.zip"

          echo "Artifact created:"
          ls -lh website.zip

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::288761746621:role/Github_oidc
          aws-region: ap-south-1

      - name: Verify AWS identity
        shell: bash
        run: aws sts get-caller-identity

      - name: Upload versioned artifact to S3
        shell: bash
        run: |
          aws s3 cp website.zip \
            "s3://dotnet-windows-s3/artifacts/${GITHUB_SHA}.zip"

      - name: Verify uploaded artifact
        shell: bash
        run: |
          aws s3api head-object \
            --bucket dotnet-windows-s3 \
            --key "artifacts/${GITHUB_SHA}.zip"

          echo "S3 artifact verification completed."

      - name: Test SSM connectivity (read-only)
        shell: bash
        env:
          INSTANCE_ID: i-0fc07c9aecbbf18a2
          AWS_REGION: ap-south-1
        run: |
          cat > ssm-commands.json <<'JSON'
          {
            "commands": [
              "Write-Output 'Read-only SSM connectivity test'",
              "Write-Output ('Computer name: ' + $env:COMPUTERNAME)",
              "Import-Module WebAdministration",
              "Get-Website -Name 'HD' | Select-Object Name, State, PhysicalPath | Format-List"
            ]
          }
          JSON

          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunPowerShellScript" \
            --instance-ids "$INSTANCE_ID" \
            --parameters file://ssm-commands.json \
            --comment "Read-only GitHub Actions SSM connectivity test" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          STATUS=""

          for attempt in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || true)

            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut|Cancelling)
                break
                ;;
            esac

            sleep 5
          done

          if [ "$STATUS" != "Success" ]; then
            echo "SSM test did not succeed. Final status: ${STATUS:-Unknown}"
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --output json || true
            exit 1
          fi

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json

          echo "Read-only SSM connectivity test succeeded."

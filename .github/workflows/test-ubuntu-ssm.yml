name: Test Ubuntu SSM Access

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test-ssm:
    runs-on: ubuntu-24.04
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::288761746621:role/Github_oidc
          aws-region: ap-south-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Send harmless command to Ubuntu
        shell: bash
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --instance-ids "i-01dfcc7734f5c3eb1" \
            --parameters '{"commands":["hostname","docker --version","sudo systemctl is-active docker","sudo systemctl is-active nginx"]}' \
            --comment "Harley Davidson Ubuntu SSM permission test" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for attempt in $(seq 1 24); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "i-01dfcc7734f5c3eb1" \
              --query Status \
              --output text 2>/dev/null || true)

            case "$STATUS" in
              Success) break ;;
              Failed|Cancelled|TimedOut)
                echo "SSM command finished with status: $STATUS"
                break
                ;;
            esac
            sleep 5
          done

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-01dfcc7734f5c3eb1" \
            --output json

          if [ "$STATUS" != "Success" ]; then
            echo "SSM permission test failed: ${STATUS:-Unknown}"
            exit 1
          fi
